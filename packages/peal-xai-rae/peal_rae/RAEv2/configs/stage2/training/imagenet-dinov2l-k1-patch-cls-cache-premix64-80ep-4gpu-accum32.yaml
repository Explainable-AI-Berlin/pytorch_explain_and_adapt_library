stage_1:
  target: stage1.RAE
  params:
    encoder_name: dinov2mls-vit-l[layers=23]
    resolution: 256
    decoder_config_path: configs/decoder/ViTXL
    pretrained_decoder_path: pretrained_models/stage1/imagenet/dinov2l-k1/decoder.pt
    noise_tau: 0.0
    normalization_stat_path: pretrained_models/stage1/imagenet/dinov2l-k1/stats.pt
stage_2:
  target: stage2.models.DDT.DiTwDDTHeadIG
  params:
    input_size: 16
    patch_size:
    - 1
    - 1
    in_channels: 1024
    hidden_size:
    - 1440
    - 2048
    depth:
    - 28
    - 2
    num_heads:
    - 20
    - 16
    mlp_ratio: 4.0
    base_model_depth: 8
    cls_conditioning: true
    cls_dim: 1024
    cls_projector_hidden_mult: 4
    cls_condition_source: dinov2_last_layer_cls
conditioning:
  type: label
  cfg_dropout_prob: 0.1
  cls_dropout_prob: 0.1
  arch:
    num_t_tokens: 4
    num_c_tokens: 8
transport:
  prediction: x
  time_dist_type: logit-normal_0_1
sampler:
  num_steps: 50
guidance:
  cfg:
    scale: 1.0
    t_min: 0.0
    t_max: 1.0
dataset:
  target: stage2_latent_cache
  type: stage2_latent_cache
  root: ${oc.env:ADA_STAGE2_CACHE}
  condition_type: label
  shared_tmpdir: ~/tmp
  cache_mode: lazy
  max_open_shards: 32
  cls_normalization: raw
  sampler: shard_batch
  sampler_seed: 42
  shard_interleave_window: 32
  drop_last: true
  prefetch_factor: 2
training:
  epochs: 80
  virtual_epoch_steps: 40032
  global_batch_size: 1024
  grad_accum_steps: 32
  ema_decay: 0.9995
  num_workers: 1
  log_interval: 100
  checkpoint_interval: 1
  sample_every: 5000
  clip_grad: 1.0
  global_seed: 42
  optimizer:
    type: gmuon
    lr: 0.0002
    momentum: 0.95
    nesterov: true
    ns_coefficients_preset: POLAR_EXPRESS_COEFFICIENTS
    ns_use_kernels: false
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_epochs: 25
    decay_end_epoch: 50
    base_lr: 0.0002
    final_lr: 2.0e-05
    warmup_from_zero: false
  image_size: 256
eval: null
misc:
  latent_size:
  - 1024
  - 16
  - 16
  num_classes: 1000
  time_dist_shift_dim: 262144
  time_dist_shift_base: 4096
