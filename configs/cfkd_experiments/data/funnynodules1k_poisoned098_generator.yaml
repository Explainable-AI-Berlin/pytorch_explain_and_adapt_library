dataset_class           : FunnyNodulesDataset
dataset_path            : $PEAL_DATA/funnynodules
num_samples             : 1000
split                   : [1.0,1.0]
input_type              : image
input_size              : [3, 64, 64]
output_type             : multiclass
output_size             : [6]
downsize                : Resize
delimiter               : ","
confounder_probability  : 0.02
confounding_factors     : [InternalStructure, Roundness]
normalization           : [0.5,0.5]
