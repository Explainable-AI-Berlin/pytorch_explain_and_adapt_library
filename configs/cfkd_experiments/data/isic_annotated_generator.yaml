dataset_class           : ISICAnnotatedDataset
dataset_path            : $PEAL_DATA/isic_annotated
num_samples             : 1000
split                   : [0.8, 1.0]
input_type              : image
input_size              : [3, 128, 128]
output_type             : multiclass
output_size             : [2]
downsize                : Resize
delimiter               : ","
has_hints               : True
confounder_probability  : 0.98
confounding_factors     : [label, confounder]
normalization           : [0.5, 0.5]