category: explainer
explainer_type: SCE
tracking_level: 4
num_attempts: 2
allow_overlap: false
batch_size: 1
clustering_strategy: highest_activation
dilation: 13
dist_l1: 0.0005
distilled_predictor:
  distill_from: predictor
  task:
    criterions:
      ce: 1.0
      l2: 100.0
    output_channels: 2
    output_type: singleclass
    y_selection: [prediction]
  training:
    adv_training: true
    class_balanced: true
    label_smoothing: 0.05
    learning_rate: 0.001
    max_epochs: 10
    mixup_alpha: 10
    optimizer: adam
    steps_per_epoch: 1000
    test_batch_size: 32
    train_batch_size: 32
    use_mixup: true
    val_batch_size: 4
gradient_clipping: 1000000000000.0
gradient_steps: 50
greedy: false
inpaint: 0.15
iterationwise_encoding: true
learning_rate: 300.0
mask_momentum: 0.0
merge_clusters: concatenate
momentum: 0.9
num_discretization_steps: 20
optimizer: SGD
orthogonalization_penatly: 0.0
parallel_attempts: 1
port: 8000
replace_with_activation: leakysoftplus
sampling_time_fraction: 0.3
seed: 0
stochastic: fully
temperature: 3.0
use_clustering: true
use_gradient_filtering: true
use_masking: true
validate_generator: false
visualize_gradients: true
y_target_goal_confidence: null
