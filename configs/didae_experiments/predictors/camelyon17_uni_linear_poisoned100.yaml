# python train_predictor.py --config "<PEAL_BASE>/configs/didae_experiments/predictors/camelyon17_uni_linear_poisoned100.yaml"
# UNI linear probe on the fully poisoned Camelyon17 data. Encoder for the shared DAE of the
# seed-variability DAE runs. Same recipe as peal_runs/camelyon17_1k/dinov2_linear_poisoned098
# (torchvision_UNI, only_last_layer, adamw); only the data changes to poisoned100.
model_path        : $PEAL_RUNS/camelyon17/encoder_uni_linear_poisoned100
data              : <PEAL_BASE>/configs/didae_experiments/data/camelyon17_poisoned100_negzero_false.yaml
training          : <PEAL_BASE>/configs/cfkd_experiments/training/img_finetuning_adamw.yaml
architecture      : torchvision_UNI
continue_training : True
only_last_layer   : True
seed              : 0
task:
  criterions:
    ce     : 1.0
    l2     : 100.0
  output_type             : singleclass
  output_channels         : 2
  y_selection             : [tumor]
