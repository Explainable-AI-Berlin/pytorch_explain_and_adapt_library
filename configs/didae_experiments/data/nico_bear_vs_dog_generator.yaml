dataset_class           : NicoPlusPlusDataset
dataset_path            : $PEAL_DATA/nico_bear_vs_dog
split                   : [0.8, 0.9]
input_type              : image
input_size              : [3, 512, 512]
output_type             : multiclass
output_size             : [2]
confounding_factors     : [label, confounder]
foreground              : [bear, dog]
background              : [water, grass]
normalization           : [0.5, 0.5]