dataset_class           : FunnyNodulesDataset
dataset_path            : $PEAL_DATA/funnynodules
num_samples             : 16000
split                   : [0.8,0.9]
input_type              : image
input_size              : [3, 64, 64]
output_split            : 1
output_type             : mixed
output_size             : [6]
downsize                : Resize
delimiter               : ","
confounder_probability  : 0.5
confounding_factors     : [InternalStructure, Roundness]
has_hints               : true
normalization           : [0.5,0.5]