# Data for the Camelyon DAE generator, as in the saved config of the January 2026
# generator (peal_runs/camelyon/diffusion_autoencoder): split [0.9, 1.0].
dataset_class           : Camelyon17AugmentedDataset
dataset_path            : $PEAL_DATA/camelyon17
split                   : [0.9, 1.0]
input_type              : image
input_size              : [3, 128, 128]
output_type             : multiclass
output_size             : [2]
normalization           : [0.5, 0.5]
set_negative_to_zero    : false
