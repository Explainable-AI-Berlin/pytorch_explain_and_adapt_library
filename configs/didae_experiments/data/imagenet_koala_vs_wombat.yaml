# ImageNet pair for shortcut discovery: koala (ImageNet 105) = class 0, whose
# training images carry the harmful spurious feature "eucalyptus plants" according to
# "Spurious Features Everywhere" (arXiv:2212.04871); wombat (ImageNet 106) = class 1
# is the visually similar control. 1300 + 1300 train images, symlinked by
#   python tools/generate_imagenet_binary_dataset.py --class1 105 --class2 106 --name koala_vs_wombat --symlink
# Class is the only attribute; confounding_factors names it so DiDAE's ground-truth
# concept matching reports which dictionary atom carries the label.
dataset_class           : Image2MixedDataset
dataset_path            : $PEAL_DATA/koala_vs_wombat
num_samples             : 2600
input_type              : image
input_size              : [3, 224, 224]
output_type             : singleclass
output_size             : [2]
downsize                : Resize
x_selection             : imgs
confounding_factors     : [Class]
# null: the DINOv3 predictor normalizes internally (ImageNet mean/std after its own
# 224 resize); a dataset normalization on top would be applied twice.
normalization           : null
