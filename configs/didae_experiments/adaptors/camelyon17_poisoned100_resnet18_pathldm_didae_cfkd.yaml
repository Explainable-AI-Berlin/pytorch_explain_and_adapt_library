# python run_cfkd.py --config "<PEAL_BASE>/configs/didae_experiments/adaptors/camelyon17_poisoned100_resnet18_pathldm_didae_cfkd.yaml"
adaptor_type                         :  "CFKD"
category                             :  "adaptor"
batch_size                           :  4
tracking_level                       :  5
min_train_samples                    :  800
finetune_iterations                  :  1
max_validation_samples               :  200
continuous_learning                  :  "finetune"
calculate_explainer_stats            :  True
calculate_group_accuracies           :  True
clustering_strategy                  :  null
explainer                            :  "<PEAL_BASE>/configs/didae_experiments/explainers/dae_distill_careful.yaml"
training                             :  <PEAL_BASE>/configs/didae_experiments/training/img_finetuning.yaml
data                                 :  <PEAL_BASE>/configs/didae_experiments/data/camelyon17_poisoned100.yaml
test_data                            :  <PEAL_BASE>/configs/cfkd_experiments/data/camelyon17_unpoisoned.yaml
student                              :  $PEAL_RUNS/camelyon17/classifier_poisoned100/model.cpl
teacher                              :  $PEAL_RUNS/camelyon17/classifier_unpoisoned/model.cpl
generator                            :  "<PEAL_BASE>/configs/didae_experiments/generators/camelyon17_pathldm_autoencoder_resnet_didae.yaml"
sparse_dictionary                    :  "<PEAL_BASE>/configs/didae_experiments/sparse_dictionaries/orthognal_camelyon17.yaml"
base_dir                             :  "$PEAL_RUNS/camelyon17/classifier_poisoned100/didae_pathldm_cfkd"
task:
  criterions:
    ce     : 1.0
    l2     : 100.0
  output_type             : singleclass
  output_channels         : 2
  y_selection             : [tumor]
