# Procrustes-CFKD baseline on the OpenAI CLIP ViT-L/14 diffusion autoencoder: CFKD told
# the two oracle directions (2-component OrthogonalProcrustes [Blond_Hair, Male] fitted in
# that generator's z_sem space), DDPM edit-friendly inversion, whole-network finetuning.
# This is the reference every DiDAE variant on this generator is compared against; it
# mirrors celeba1kx098_resnet18_didae_openclip_ddpm_cfkd.yaml (the same on the fully
# trained OpenCLIP generator: worst-group 0.436 -> 0.600, avg-group 0.746 -> 0.808).
# python -W ignore run_cfkd.py --config "<PEAL_BASE>/configs/didae_experiments/adaptors/celeba1kx098_resnet18_procrustes_openai_clip_cfkd.yaml"
adaptor_type                         :  "CFKD"
category                             :  "adaptor"
batch_size                           :  200
tracking_level                       :  5
min_train_samples                    :  800
finetune_iterations                  :  1
max_validation_samples               :  200
continuous_learning                  :  "finetune"
calculate_group_accuracies           :  True
calculate_explainer_stats            :  True
explainer                            :  <PEAL_BASE>/configs/didae_experiments/explainers/dae_distill_ddpm.yaml
training                             :  <PEAL_BASE>/configs/cfkd_experiments/training/img_finetuning.yaml
data                                 :  <PEAL_BASE>/configs/cfkd_experiments/data/celeba1k_Blond_Hair_confounding_Male_poisoned098.yaml
test_data                            :  <PEAL_BASE>/configs/cfkd_experiments/data/celeba.yaml
student                              :  $PEAL_RUNS/celeba1k/Blond_Hair/classifier_poisoned098/model.cpl
teacher                              :  $PEAL_RUNS/celeba/Blond_Hair/classifier_unpoisoned/model.cpl
# _slim = the same final.ckpt (step 40000) minus optimizer state and frozen CLIP encoder
# keys; identical weights, fits the 16 GiB cgroup. See the README.txt in that directory.
generator                            :  $PEAL_RUNS/celeba/diffusion_autoencoder_openai_clip_vit_l14_slim/config.yaml
sparse_dictionary                    :  $PEAL_RUNS/celeba/diffusion_autoencoder_openai_clip_vit_l14/OrthogonalProcrustesDictionary/config.yaml
base_dir                             :  $PEAL_RUNS/celeba1k/Blond_Hair/classifier_poisoned098/procrustes_openai_clip_cfkd_ddpm
task:
  criterions:
    ce     : 1.0
    l2     : 100.0
  output_type             : singleclass
  output_channels         : 2
  y_selection             : [Blond_Hair]
