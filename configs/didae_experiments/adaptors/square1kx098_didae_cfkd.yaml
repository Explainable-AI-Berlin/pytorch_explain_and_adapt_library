# python run_cfkd.py --config "<PEAL_BASE>/configs/didae_experiments/adaptors/square1kx098_didae_cfkd.yaml"
#
# Paper: Table 4 (tab:quantitative_base_models), row "Square / Probe", Gain 84.7.
# The same run supplies the "Square / Probe -> Procrustes" row of Table 5
# (tab:quantitative_dictionaries, 84.7 against SVD's 75.6) and the Square cell of
# the DiDAE-CFKD row in Table 7 (tab:sota_comparison_foundation_model_fixing,
# 84.7 against Projection's 53.4).
#
# The student is the linear probe on the frozen foundation model trained by
# configs/didae_experiments/predictors/square1k_foundation_linear_poisoned098.yaml,
# NOT the ResNet-18. The ResNet-18 counterpart is Table 2's Square DiDAE row and
# is produced by square1k_resnet18_poisoned098_didae_procrustes_cfkd.yaml.
# The SVD arm of Table 5 is square1kx098_didae_svd_cfkd.yaml; the pre-clustered
# teacher behind Table 6's Square 80.1 is
# square1kx098_didae_procrustes_cfkd_preclustered_teacher.yaml.
#
# Content is identical to square1kx098_didae_procrustes_cfkd.yaml, which no
# reproduction script references; this is the name the script calls.
adaptor_type                         :  "CFKD"
category                             :  "adaptor"
batch_size                           :  200
tracking_level                       :  5
min_train_samples                    :  800
finetune_iterations                  :  1
max_validation_samples               :  200
continuous_learning                  :  "deep_feature_reweighting"
calculate_group_accuracies           :  True
calculate_explainer_stats            :  True
explainer                            :  <PEAL_BASE>/configs/didae_experiments/explainers/dae_distill.yaml
training                             :  <PEAL_BASE>/configs/cfkd_experiments/training/img_finetuning.yaml
data                                 :  <PEAL_BASE>/configs/cfkd_experiments/data/square1k_poisoned098.yaml
test_data                            :  <PEAL_BASE>/configs/cfkd_experiments/data/square_unpoisoned.yaml
student                              :  $PEAL_RUNS/square1k/colora_confounding_colorb/torchvision/foundation_poisoned098/model.cpl
teacher                              :  $PEAL_RUNS/square/colora_confounding_colorb/torchvision/classifier_unpoisoned/model.cpl
generator                            :  $PEAL_RUNS/square/diffusion_autoencoder/config.yaml
sparse_dictionary                    :  $PEAL_RUNS/square/diffusion_autoencoder/OrthogonalProcrustesDictionary/config.yaml
base_dir                             :  $PEAL_RUNS/square1k/colora_confounding_colorb/torchvision/foundation_poisoned098/didae_cfkd
task:
  criterions:
    ce     : 1.0
    l2     : 100.0
  output_type             : singleclass
  output_channels         : 2
  y_selection             : [ClassA]