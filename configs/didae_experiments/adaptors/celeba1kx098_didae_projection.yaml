# python run_adaptor.py --config "<PEAL_BASE>/configs/didae_experiments/adaptors/celeba1kx098_didae_projection.yaml"
#
# Paper: Table 7 (tab:sota_comparison_foundation_model_fixing), row "Projection",
# column "Blond", Gain 22.6, against DiDAE-CFKD's 70.6 on the same probe. The
# Square half of that row, 53.4, comes from square1kx098_didae_projection.yaml.
# The table answers "is projection enough?": projecting the spurious direction out
# of the frozen embedding and retraining the probe recovers only part of the Gain
# that CFKD augmentation along the same direction achieves.
#
# projected_component_index_list [1] is the Male atom of the 2-component CelebA
# Procrustes dictionary (y_selection [Blond_Hair, Male]), i.e. the confounder.
#
# Aligned 2026-09-26: this and celeba1kx098_openclip_didae_cfkd.yaml now share ONE
# dictionary, the OpenAI CLIP ViT-L/14 Procrustes dictionary the paper names, so Table 7's
# two halves finally act along the same direction on the same probe as its caption claims.
#
# Content is identical to celeba1000x098_didae_projection.yaml, which no
# reproduction script references; this is the name the script calls.
adaptor_type                         :  "ProjectionAdaptor"
category                             :  "adaptor"
data                                 :  <PEAL_BASE>/configs/cfkd_experiments/data/celeba1k_Blond_Hair_confounding_Male_poisoned098.yaml
test_data                            :  <PEAL_BASE>/configs/cfkd_experiments/data/celeba.yaml
base_model_config                    :  $PEAL_RUNS/celeba1k/Blond_Hair/openai_clip_vit_l14_linear_poisoned098/config.yaml
base_dir                             :  $PEAL_RUNS/celeba1k/Blond_Hair/openai_clip_vit_l14_linear_poisoned098/didae_projection
projected_component_index_list       :  [1]
sparse_dictionary                    :  $PEAL_RUNS/celeba/diffusion_autoencoder_openai_clip_vit_l14/OrthogonalProcrustesDictionary/config.yaml

