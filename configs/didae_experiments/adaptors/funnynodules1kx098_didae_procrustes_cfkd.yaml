# python run_cfkd.py --config "<PEAL_BASE>/configs/didae_experiments/adaptors/funnynodules1kx098_didae_procrustes_cfkd.yaml"
adaptor_type                         :  "CFKD"
category                             :  "adaptor"
batch_size                           :  50
tracking_level                       :  5
min_train_samples                    :  800
finetune_iterations                  :  1
max_validation_samples               :  200
continuous_learning                  :  "deep_feature_reweighting"
calculate_group_accuracies           :  True
calculate_explainer_stats            :  True
explainer                            :  <PEAL_BASE>/configs/didae_experiments/explainers/dae_distill.yaml
training                             :  <PEAL_BASE>/configs/cfkd_experiments/training/img_finetuning.yaml
data                                 :  <PEAL_BASE>/configs/cfkd_experiments/data/funnynodules1k_poisoned098.yaml
test_data                            :  <PEAL_BASE>/configs/cfkd_experiments/data/funnynodules_unpoisoned.yaml
student                              :  $PEAL_RUNS/funnynodules1k/internalstructure_confounding_roundness/classifier_poisoned098/model.cpl
teacher                              :  $PEAL_RUNS/funnynodules/internalstructure_confounding_roundness/torchvision/classifier_unpoisoned/model.cpl
generator                            :  $PEAL_RUNS/funnynodules/diffusion_autoencoder/config.yaml
sparse_dictionary                    :  $PEAL_RUNS/funnynodules/diffusion_autoencoder/OrthogonalProcrustesDictionary/config.yaml
base_dir                             :  $PEAL_RUNS/funnynodules1k/internalstructure_confounding_roundness/classifier_poisoned098/didae_cfkd
task:
  criterions:
    ce     : 1.0
    l2     : 100.0
  output_type             : singleclass
  output_channels         : 2
  y_selection             : [InternalStructure]
