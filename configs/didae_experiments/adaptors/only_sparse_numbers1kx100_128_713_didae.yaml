# DiDAE: Automated counterfactual discovery and correction for sparse numbers dataset (Num128 & Num713, 100% poisoned)
# Usage: python -W ignore run_didae.py --config "<PEAL_BASE>/configs/didae_experiments/adaptors/only_sparse_numbers1kx100_128_713_didae.yaml"
# continue from cache: python -W ignore run_didae.py --config  $PEAL_RUNS/only_sparse_numbers1k/num128_confounding_num713/torchvision/classifier_poisoned100/didae/config.yaml
adaptor_type                         :  "DiDAE"
category                             :  "adaptor"
tracking_level                       :  5
n_samples                            :  200
top_k_directions                     :  10
max_cf_per_direction                 :  5
linesearch_factors                   :  ["dynamic"]
decode_batch_size                    :  32
batch_size                           :  200
min_train_samples                    :  800
max_validation_samples               :  200
finetune_iterations                  :  1
continuous_learning                  :  "deep_feature_reweighting"
calculate_group_accuracies           :  True
lasso_alpha                          :  0.05
explainer                            :  <PEAL_BASE>/configs/didae_experiments/explainers/dae_distill.yaml
training                             :  <PEAL_BASE>/configs/cfkd_experiments/training/img_finetuning.yaml
data                                 :  <PEAL_BASE>/configs/didae_experiments/data/only_sparse_numbers1k_poisoned100_128_713.yaml
test_data                            :  <PEAL_BASE>/configs/didae_experiments/data/only_sparse_numbers_unpoisoned_128_713.yaml
student                              :  $PEAL_RUNS/only_sparse_numbers1k/num128_confounding_num713/torchvision/classifier_poisoned100/model.cpl
# Teacher: unpoisoned .cpl oracle (Model2ModelTeacher), automated + unattended.
# For the LLM-as-human variant see only_sparse_numbers1kx100_128_713_didae_llmteacher.yaml (teacher: {type: llm}).
teacher                              :  $PEAL_RUNS/only_sparse_numbers/num128_confounding_num713/torchvision/classifier_unpoisoned/model.cpl
generator                            :  $PEAL_RUNS/only_sparse_numbers/diffusion_autoencoder/config.yaml
sparse_dictionary                    :  $PEAL_RUNS/only_sparse_numbers/diffusion_autoencoder/BatchTopKSAE/config.yaml
base_dir                             :  $PEAL_RUNS/only_sparse_numbers1k/num128_confounding_num713/torchvision/classifier_poisoned100/didae
task:
  criterions:
    ce     : 1.0
    l2     : 100.0
  output_type             : singleclass
  output_channels         : 2
  y_selection             : [Num128]
