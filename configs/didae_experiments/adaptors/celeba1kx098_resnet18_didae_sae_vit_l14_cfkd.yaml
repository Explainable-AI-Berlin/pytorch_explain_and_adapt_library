# CFKD with the OpenCLIP ViT-L/14 batch-topk SAE, teacher = unpoisoned resnet18 (Blond_Hair confounded by Male, 98% poisoned)
# python -W ignore run_cfkd.py --config "<PEAL_BASE>/configs/didae_experiments/adaptors/celeba1kx098_resnet18_didae_sae_vit_l14_cfkd.yaml"
adaptor_type                         :  "CFKD"
category                             :  "adaptor"
batch_size                           :  200
tracking_level                       :  5
min_train_samples                    :  800
finetune_iterations                  :  1
max_validation_samples               :  200
continuous_learning                  :  "deep_feature_reweighting"
calculate_group_accuracies           :  True
calculate_explainer_stats            :  True
explainer                            :  <PEAL_BASE>/configs/didae_experiments/explainers/dae_distill_ddpm.yaml
training                             :  <PEAL_BASE>/configs/cfkd_experiments/training/img_finetuning.yaml
data                                 :  <PEAL_BASE>/configs/cfkd_experiments/data/celeba1k_Blond_Hair_confounding_Male_poisoned098.yaml
test_data                            :  <PEAL_BASE>/configs/cfkd_experiments/data/celeba.yaml
student                              :  $PEAL_RUNS/celeba1k/Blond_Hair/classifier_poisoned098/model.cpl
teacher                              :  $PEAL_RUNS/celeba/Blond_Hair/classifier_unpoisoned/model.cpl
generator                            :  $PEAL_RUNS/celeba/diffusion_autoencoder_openclip_vit_l14/config.yaml
sparse_dictionary                    :  $PEAL_RUNS/celeba/diffusion_autoencoder_openclip_vit_l14/celeba_vit_l14_batch_topk/config.yaml
# latents matched to Blond_Hair / Male in celeba_vit_l14_batch_topk (|corr| 0.36 / 0.24 - weak; re-derive after the ViT-L/14 SAE sweep)
component_indices                    :  [1190, 1184] # [Blond_Hair, Male]
base_dir                             :  $PEAL_RUNS/celeba1k/Blond_Hair/classifier_poisoned098/didae_sae_vit_l14_cfkd_ddpm
task:
  criterions:
    ce     : 1.0
    l2     : 100.0
  output_type             : singleclass
  output_channels         : 2
  y_selection             : [Blond_Hair]
