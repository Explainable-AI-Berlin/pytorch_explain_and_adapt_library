# RAEv2 Stage 1 for the CelebA RAE generator with a frozen OpenAI CLIP ViT-L/14
# encoder (celeba_rae_clip.yaml) -- the CelebA twin of
# stage1_imagenet_clip_vitl14.yaml, same recipe, sized for ONE A100 80GB and a
# 202599-image dataset instead of 4 H100 and ImageNet.
#
# Consumed by RAEv2's src/train_stage1.py (OmegaConf-merged into Stage1Config),
# launched through peal/generators/rae_pipeline.py. All paths are absolute
# because RAEv2 resolves them against its own working directory.
#
# Differences from the ImageNet stage 1:
#   dataset       CelebA as an ImageFolder tree: the 202599 jpgs of
#                 $PEAL_DATA/celeba/imgs are reachable as one class directory
#                 through the symlink <base_path>/imagefolder/train/all, which
#                 is what RAEv2's ImageNet loader falls back to when no Arrow
#                 dataset exists (and what compute_encoder_stats.py reads
#                 directly). The class label is unused: stage 2 conditions on
#                 the CLIP embedding, not on a label.
#                 Images are 178x218, so Resize(256) + CenterCrop(256) keeps the
#                 full width and crops the head/shoulder margins -- the framing
#                 CelebA-HQ uses.
#   epochs        16 as upstream, and it fits: measured on one A100 80GB
#                 (2026-09-15, this config) 3.3 s/step before the GAN phase and
#                 8.0 s/step inside it at global batch 256, i.e. 44 min and
#                 106 min per 202599-image epoch -> 6 x 0.73 h + 2 x ~1.3 h +
#                 8 x 1.76 h = ~21 h. The cosine schedule and disc_start/
#                 disc_upd_start are the upstream 16/8/6; change them together.
#   batch         global 256 (grad_accum 8 = 32 images on the single GPU; 64
#                 OOMs in the GAN phase on 80 GB, measured on the ImageNet run).
#   num_workers   4, the allocation's CPU count.
stage_1:
  target: stage1.RAE
  params:
    encoder_name: clipproj-vit-L
    resolution: 256
    decoder_config_path: <PEAL_RAEV2>/configs/decoder/ViTXL
    noise_tau: 0.8

dataset:
  target: imagenet
  type: hf
  data_dir: $PEAL_RUNS/celeba/rae_clip/imagefolder
  split: train
  condition_type: label
  shared_tmpdir: /tmp/rae_clip_celeba_tmp

training:
  epochs: 16
  ema_decay: 0.9978
  global_batch_size: 256
  grad_accum_steps: 8   # 32 images on the single A100
  num_workers: 4
  clip_grad: 0.0
  log_interval: 50
  checkpoint_interval: 1
  sample_every: 2500
  image_size: 256
  global_seed: 0
  optimizer:
    type: adamw
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: cosine
    warmup_epochs: 1
    decay_end_epoch: 16
    base_lr: 2.0e-4
    final_lr: 2.0e-5
    warmup_from_zero: true

# eval disabled for the same reason as on ImageNet: RAEv2's reconstruction eval
# unconditionally needs a reference NPZ of the val images and crashes the run at
# the first eval step. Reconstruction quality is tracked from the EMA
# checkpoints by the supervising session instead.
eval: null

gan:
  arch:
    dino_ckpt_path: <PEAL_RAEV2>/pretrained_models/encoders/dino/dino_vit_small_patch8_224.pth
    ks: 9
    norm_type: bn
    using_spec_norm: true
    recipe: S_8
  optimizer:
    type: adamw
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: cosine
    warmup_epochs: 1
    decay_end_epoch: 16
    base_lr: 2.0e-4
    final_lr: 2.0e-5
    warmup_from_zero: true
  augment:
    prob: 1.0
    cutout: 0.0
  loss:
    disc_loss: hinge
    gen_loss: vanilla
    disc_weight: 0.75
    perceptual_weight: 1.0
    disc_start: 8
    disc_upd_start: 6
    lpips_start: 0
    max_d_weight: 10000.0
    disc_updates: 1
