# RAEv2 Stage 2 for celeba_rae_clip.yaml: DDT (DiTwDDTHeadIG) trained with flow
# matching on the stage-1 CLIP latent and conditioned on the 768-d CLIP image
# embedding through additive AdaLN (conditioning.type: cls, the ADA "cls_only"
# variant). The CelebA twin of stage2_imagenet_clip_vitl14.yaml.
#
# Differences from the ImageNet stage 2:
#   size       hidden [1024, 1536], depth [16, 2], heads [16, 12] (~0.35B)
#              instead of [1440, 2048] / [28, 2] / [20, 16] (1.24B). One A100
#              instead of four H100, and 202599 images instead of 1.28M: the XL
#              DDT would see ~7 samples per parameter in the time available.
#   dataset    the same premixed latent + CLS cache format, built once by
#              rae_pipeline from the CelebA ImageFolder tree (original + hflip
#              views = 405198 latents, ~210 GB on node-local /tmp).
#   epochs     24 cache epochs (48 CelebA passes, 9.7M samples) with warmup 7 /
#              decay end 15, the ImageNet schedule's 46/14/29 rescaled.
#   num_classes stays 1000 although the ImageFolder tree has a single class:
#              the label embedder is unused under conditioning.type cls.
stage_1:
  target: stage1.RAE
  params:
    encoder_name: clipproj-vit-L
    resolution: 256
    decoder_config_path: <PEAL_RAEV2>/configs/decoder/ViTXL
    pretrained_decoder_path: $PEAL_RUNS/celeba/rae_clip/stage1_assets/decoder.pt
    normalization_stat_path: $PEAL_RUNS/celeba/rae_clip/stage1_assets/stats.pt
    noise_tau: 0.0
stage_2:
  target: stage2.models.DDT.DiTwDDTHeadIG
  params:
    input_size: 16
    patch_size: [1, 1]
    in_channels: 1024
    hidden_size: [1024, 1536]
    depth: [16, 2]
    num_heads: [16, 12]
    mlp_ratio: 4.0
    base_model_depth: 6
    cls_conditioning: true
    cls_dim: 768
    cls_projector_hidden_mult: 4
    cls_condition_source: clip_image_embedding
conditioning:
  type: cls
  cfg_dropout_prob: 0.1
  arch:
    num_t_tokens: 4
    num_c_tokens: 8
transport:
  prediction: x
  time_dist_type: logit-normal_0_1
sampler:
  num_steps: 50
guidance:
  cfg:
    scale: 1.0
    t_min: 0.0
    t_max: 1.0
dataset:
  # premixed latent + CLS cache built by rae_pipeline's cache stage; RAE_STAGE2_CACHE
  # is exported by the pipeline (and by RAEDiffusionAutoencoder) from cache_dir.
  target: stage2_latent_cache
  type: stage2_latent_cache
  root: ${oc.env:RAE_STAGE2_CACHE}
  condition_type: cls
  shared_tmpdir: /tmp/rae_clip_celeba_tmp
  cache_mode: lazy
  max_open_shards: 8
  cls_normalization: raw
  sampler: shard_batch
  sampler_seed: 42
  shard_interleave_window: 32
  drop_last: true
  prefetch_factor: 2
training:
  epochs: 24   # cache epochs (2 CelebA passes each)
  global_batch_size: 256
  grad_accum_steps: 8   # 32 latents on the single A100
  ema_decay: 0.9995
  num_workers: 4
  log_interval: 50
  checkpoint_interval: 1
  sample_every: 5000
  clip_grad: 1.0
  global_seed: 42
  optimizer:
    type: adamw
    lr: 0.0002
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_epochs: 7    # ImageNet recipe 14 of 46, rescaled to 24 epochs
    decay_end_epoch: 15 # ImageNet recipe 29 of 46
    base_lr: 0.0002
    final_lr: 2.0e-05
    warmup_from_zero: false
  image_size: 256
eval: null
misc:
  latent_size: [1024, 16, 16]
  num_classes: 1000
  time_dist_shift_dim: 262144
  time_dist_shift_base: 4096
