# python run_cfkd.py --config "<PEAL_BASE>/configs/diffae_experiments/adaptors/celeba1kx098_resnet18_didae_openclip_cfkd.yaml"
adaptor_type                         :  "CFKD"
category                             :  "adaptor"
batch_size                           :  20 #4
tracking_level                       :  3 #5
min_train_samples                    :  800
finetune_iterations                  :  1
max_validation_samples               :  200
continuous_learning                  :  "finetune" #"deep_feature_reweighting"
calculate_group_accuracies           :  True
calculate_explainer_stats            :  True
explainer                            :  <PEAL_BASE>/configs/diffae_experiments/explainers/dae_distill.yaml
training                             :  <PEAL_BASE>/configs/cfkd_experiments/training/img_finetuning.yaml
data                                 :  <PEAL_BASE>/configs/cfkd_experiments/data/celeba1k_Blond_Hair_confounding_Male_poisoned098.yaml
test_data                            :  <PEAL_BASE>/configs/cfkd_experiments/data/celeba.yaml
student                              :  $PEAL_RUNS/celeba1k/Blond_Hair/resnet18_poisoned098/model.cpl
teacher                              :  $PEAL_RUNS/celeba/Blond_Hair/resnet18_unpoisoned/model.cpl
generator                            :  $PEAL_RUNS/celeba/diffusion_autoencoder_openclip/config.yaml
sparse_dictionary                    :  $PEAL_RUNS/celeba/diffusion_autoencoder_openclip/OrthogonalProcrustesDictionary/config.yaml
base_dir                             :  $PEAL_RUNS/celeba1k/Blond_Hair/resnet18_poisoned098/openclip_didae_cfkd
task:
  criterions:
    ce     : 1.0
    l2     : 100.0
  output_type             : singleclass
  output_channels         : 2
  y_selection             : [Blond_Hair]