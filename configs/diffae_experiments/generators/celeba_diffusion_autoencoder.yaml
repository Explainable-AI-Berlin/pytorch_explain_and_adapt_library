# python train_generator.py --config "<PEAL_BASE>/configs/diffae_experiments/generators/celeba_diffusion_autoencoder.yaml"
category: generator
generator_type: DiffusionAutoencoder
data: "<PEAL_BASE>/configs/diffae_experiments/data/celeba_stable_diffusion.yaml"
base_path : $PEAL_RUNS/celeba/diffusion_autoencoder
encoder: "facebook/dinov2-small"
task_config:
  criterions:
    bce     : 1.0
    l2      : 1.0
  output_type             : multiclass
  y_selection             : []
  output_channels         : 40