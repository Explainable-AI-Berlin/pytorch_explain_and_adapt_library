# python train_generator.py --config "<PEAL_BASE>/configs/diffae_experiments/generators/celeba_stable_diffusion_autoencoder.yaml"
category: generator
generator_type: StableDiffusionAutoencoder
data: "<PEAL_BASE>/configs/diffae_experiments/data/celeba_stable_diffusion.yaml"
base_path : $PEAL_RUNS/celeba/stable_diffusion_autoencoder
encoder: "open_clip" #"facebook/dinov2-base"
task_config:
  criterions:
    bce     : 1.0
    l2      : 1.0
  output_type             : multiclass
  y_selection             : []
  output_channels         : 40

use_lora: False
learning_rate: 2e-4
num_train_epochs: 200
train_batch_size: 8
snr_gamma: 5.0
center_crop: True
random_flip: True