# python run_cfkd.py --config "<PEAL_BASE>/configs/unit_test/square_sce_cfkd_unit_test.yaml"
#
# Smoke test only: 24 training counterfactuals instead of 800 and 8 validation ones instead of
# 200, so the Gain it reports is noise. It exists to prove the explainer runs, the teacher is
# consulted, the counterfactual dataset is built and the student is finetuned end to end.
# The student and generator are the ones the two configs above produce.
adaptor_type                         :  "CFKD"
category                             :  "adaptor"
batch_size                           :  6
tracking_level                       :  3
min_train_samples                    :  24
finetune_iterations                  :  1
max_validation_samples               :  8
continuous_learning                  :  "finetune"
calculate_group_accuracies           :  True
calculate_explainer_stats            :  False
explainer                            :  <PEAL_BASE>/configs/cfkd_experiments/explainers/sce_default64x64.yaml
training                             :  <PEAL_BASE>/configs/unit_test/training_unit_test.yaml
data                                 :  <PEAL_BASE>/configs/cfkd_experiments/data/square1k_poisoned098.yaml
test_data                            :  <PEAL_BASE>/configs/cfkd_experiments/data/square_unpoisoned.yaml
student                              :  $PEAL_RUNS/unit_test/square/classifier/model.cpl
teacher                              :  $PEAL_RUNS/square/colora_confounding_colorb/torchvision/classifier_unpoisoned/model.cpl
generator                            :  $PEAL_RUNS/unit_test/square/ddpm/config.yaml
base_dir                             :  $PEAL_RUNS/unit_test/square/classifier/sce_cfkd
task:
  criterions:
    ce     : 1.0
    l2     : 100.0
  output_type             : singleclass
  output_channels         : 2
  y_selection             : [ClassA]
