# python train_generator.py --config "<PEAL_BASE>/configs/unit_test/square_ddpm_unit_test.yaml"
#
# Smoke test only: 200 steps instead of 10000, so the FID is meaningless. It exists to prove
# that generator training starts, checkpoints and writes <base_path>/config.yaml.
generator_type : DDPM
category : generator
base_path : $PEAL_RUNS/unit_test/square/ddpm
data: <PEAL_BASE>/configs/cfkd_experiments/data/square1k_poisoned098_generator.yaml
image_size: 64
batch_size: 32
save_interval: 100
max_steps: 200
