# python run_cfkd.py --config configs/tabular_experiments/adaptors/circle_cfkd.yaml
batch_size                           :  8
min_train_samples                    :  8 #hyperparameter as proportion of the full dataset
mixing_ratio                         :  0.5 # 1 `only new dataset, 0 `only old dataset
finetune_iterations                  :  5 #hyperparameter
max_validation_samples               :  8
continuous_learning                  :  False
replace_model                        :  True
explainer                            :  <PEAL_BASE>/configs/explainers/counterfactual_default.yaml
training                             :  <PEAL_BASE>/configs/training/symbolic_classifier.yaml
data                                 :  <PEAL_BASE>/configs/data/circle_dataset_diffusion_poisoned.yaml
test_data                            :  <PEAL_BASE>/configs/data/circle_dataset_diffusion_unpoisoned.yaml
student                              :  $PEAL_RUNS/circle/classifier_poisoned/model.cpl
teacher                              :  $PEAL_RUNS/circle/classifier_unpoisoned/model.cpl
generator                            :  $PEAL_RUNS/circle/ddpm/config.yaml
base_dir                             :  $PEAL_RUNS/circle/classifier_poisoned/cfkd
task:
  criterions:
    ce     : 1.0
    l1     : 100.0
  output_type             : multiclass
  output_channels         : 2
  y_selection             : [Target]
  x_selection             : [x1, x2]