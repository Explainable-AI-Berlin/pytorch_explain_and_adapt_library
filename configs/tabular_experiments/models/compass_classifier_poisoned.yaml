# python train_predictor.py --config configs/tabular_experiments/models/compass_classifier_poisoned.yaml
model_path        : $PEAL_RUNS/compass/classifier_poisoned
data              : <PEAL_BASE>/configs/tabular_experiments/data/compass.yaml
training          : <PEAL_BASE>/configs/tabular_experiments/training/symbolic_classifier.yaml
architecture      : <PEAL_BASE>/configs/tabular_experiments/architectures/symbolic2vector.yaml
task:
  criterions:
    ce     : 1.0
  output_type             : singleclass
  output_size             : 2
  y_selection             : [Target]
  x_selection             : [Number_of_Priors, score_factor, Age_Above_FourtyFive, Age_Below_TwentyFive, African_American, Asian, Hispanic, Native_American, Other, Female, Misdemeanor]
