# Cougar = class 0 (ImageNet index 286)
# Cheetah = class 1 (ImageNet index 293)
# Use: python tools/convert_imagenet_resnet18_to_binary_onnx.py --class1 286 --class2 293 --name cougar_vs_cheetah
model_path        : $PEAL_RUNS/imagenet/cougar_vs_cheetah_classifier
architecture      : onnx
data              : <PEAL_BASE>/configs/cfkd_fastdime_hq/data/imagenet_cougar_vs_cheetah.yaml
task:
  criterions:
    ce     : 1.0
  output_type             : singleclass
  output_channels         : 2
