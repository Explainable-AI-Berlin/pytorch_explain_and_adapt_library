# Egyptian Cat = class 0 (ImageNet index 285)
# Persian Cat = class 1 (ImageNet index 283)
# Use: python tools/convert_imagenet_resnet18_to_binary_onnx.py --class1 285 --class2 283 --name egyptian_cat_vs_persian_cat
model_path        : $PEAL_RUNS/imagenet/egyptian_cat_vs_persian_cat_classifier
architecture      : onnx
data              : <PEAL_BASE>/configs/cfkd_fastdime_hq/data/imagenet_egyptian_cat_vs_persian_cat.yaml
task:
  criterions:
    ce     : 1.0
  output_type             : singleclass
  output_channels         : 2
