dataset_class           : Image2MixedDataset
dataset_path            : $PEAL_DATA/egyptian_cat_vs_persian_cat
num_samples             : 2600
input_type              : image
input_size              : [3, 224, 224]
output_type             : singleclass
output_size             : [2]
downsize                : Resize
x_selection             : imgs
normalization           : [[0.485, 0.456, 0.406], [0.229, 0.224, 0.225]]
# Egyptian Cat = class 0 (ImageNet index 285)
# Persian Cat = class 1 (ImageNet index 283)
