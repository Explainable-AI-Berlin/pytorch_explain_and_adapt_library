dataset_class           : Image2MixedDataset
dataset_path            : $PEAL_DATA/cougar_vs_cheetah
num_samples             : 2600
input_type              : image
input_size              : [3, 224, 224]
output_type             : singleclass
output_size             : [2]
downsize                : Resize
x_selection             : imgs
normalization           : [[0.485, 0.456, 0.406], [0.229, 0.224, 0.225]]
# Cougar = class 0 (ImageNet index 286)
# Cheetah = class 1 (ImageNet index 293)
