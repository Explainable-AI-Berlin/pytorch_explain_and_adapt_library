dataset_class           : Image2MixedDataset
dataset_path            : $PEAL_DATA/wolf_vs_eskimo_dog
num_samples             : 2600
input_type              : image
input_size              : [3, 224, 224]
output_type             : singleclass
output_size             : [2]
downsize                : Resize
x_selection             : imgs
normalization           : [[0.485, 0.456, 0.406], [0.229, 0.224, 0.225]]
# Wolf (grey wolf) = class 0 (ImageNet index 269)
# Eskimo Dog = class 1 (ImageNet index 248)
