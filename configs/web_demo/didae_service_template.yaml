# DiDAE config template of the web demo. peal/web/config_builder.py fills in
# the job-specific keys (student, teacher dir, data, generator, base_dir, task)
# and writes the result as <job>/config.yaml; everything else here is the
# service-mode default budget. Tune here, not in the builder.
#
# Budget rationale (2026-09-25): a public job must finish in well under an hour
# on one GPU. The latent sweep over the 6144 MSAE atoms is minutes; rendering
# is the cost, so only the top directions are decoded (an upper-bound ranking,
# see DiDAEConfig.service_mode). Step 9 finetunes on
# the directions the uploader judged "false" with Baseline:false as the CFKD
# teacher, one finetune iteration.
#
# Sweep settings (2026-09-28) follow the fireboat run of
# reproduction_scripts/reproduce_didae_results.sh
# (configs/didae_experiments/adaptors/imagenet_fireboat_vs_lifeboat_curated5717_dinov3_ep43s100_msae.yaml):
# single atoms driven to 3x their empirical [c_min, c_max] range, a 400 + 100
# sample pool, top 10 directions with 5 pairs each, decode batch 32. Unlike that
# run, ALL atoms are swept (no sweep_atom_subset: the shortcut of an upload is
# unknown) and only the top max_decode_directions latent directions are rendered
# (every latent flip of each). The builder sets max_decode_directions and
# top_k_directions from the form field "render_directions" (default 10).
adaptor_type                         :  "DiDAE"
category                             :  "adaptor"
tracking_level                       :  4
service_mode                         :  True
latent_only                          :  False
top_k_directions                     :  10
max_cf_per_direction                 :  5
max_decode_directions                :  10
max_decode_per_direction             :  null
# Minimal edits (2026-09-29): the counterfactuals are shown to people who judge
# them, and edits driven to 3x the empirical bounds, rendered from the flips
# deepest past the boundary, changed far more than the concept. Now: the
# bounds as observed (component_bounds_scale 1), every edit shortened to
# edit_depth_factor x the smallest step that crosses the distilled probe's
# boundary (headroom for the RAE realising only ~1/3 of a latent step), and
# an unbiased random choice of which flips to render.
decode_selection                     :  "random"
edit_depth_factor                    :  2.0
# every verified pair is written to run/successful_flips (the page shows them all)
max_export_per_direction             :  null
component_bounds_scale               :  1.0
linesearch_factors                   :  ["dynamic"]
decode_batch_size                    :  32
batch_size                           :  10
min_train_samples                    :  400
max_validation_samples               :  100
max_test_batches                     :  10
# Full CFKD finetuning (step 9) runs only when a job asks for it (form field
# "correction" = finetune; peal/web/config_builder.py sets this key). It used to
# be the default; on the Waterbirds DINOv3 probe (2026-09-29) it ran 7 h
# (20 epochs x 1000 steps of img_finetuning.yaml at 1.9 s/step) while validation
# accuracy fell from 0.94 to ~0.55. The default correction is now DFR
# (peal/web/dfr.py, last layer only, about a minute), or none.
finetune_iterations                  :  0
continuous_learning                  :  "finetune"
calculate_group_accuracies           :  False
lasso_alpha                          :  0.01
lasso_alphas                         :  [0.0, 0.001, 0.01, 0.1]
use_generator_data_for_matching      :  False
concept_replacement                  :  False
run_cfkd_on_false_directions         :  True
cfkd_false_direction_min_share       :  0.25
cfkd_max_false_directions            :  3
cfkd_teacher                         :  "Baseline:false"
export_onnx                          :  True
overwrite                            :  True
seed                                 :  0
explainer                            :  <PEAL_BASE>/configs/didae_experiments/explainers/dae_distill.yaml
training                             :  <PEAL_BASE>/configs/cfkd_experiments/training/img_finetuning.yaml
sparse_dictionary                    :  <PEAL_BASE>/configs/didae_experiments/sparse_dictionaries/msae_decomposition.yaml
task:
  criterions:
    ce     : 1.0
    l2     : 100.0
  output_type             : singleclass
  output_channels         : 2
  y_selection             : [Class]
