  # SQLite (Special Handling)
  # ldm has sqlite=3.41.2 from defaults. peal has libsqlite=3.42.0 from conda-forge.
  # The previous error "Could not find a version that satisfies the requirement sqlite==3.41.2" implies pip was looking for a *pip* package,
  # but the conda environment *did* have sqlite=3.41.2.
  # The `peal` environment has `libsqlite=3.42.0`, which is newer and from `conda-forge`.
  # I will keep `libsqlite=3.42.0` from `conda-forge` as it's newer and from a more comprehensive channel.
  # If the pip requirement for `sqlite==3.41.2` persists, it means a *Python binding* for sqlite was missing.
  # Typically, the `sqlite3` module is built into Python. If a project explicitly needs `sqlite==3.41.2` via pip,
  # it might refer to `pysqlite3` or a similar wrapper.
  # Given `libsqlite=3.42.0` is provided by conda-forge, this should satisfy the underlying C library.
  # If pip still fails, we may need to specifically add a python binding.
  - libsqlite=3.42.0=h2797004_0 # From peal, newer

  # Python-graphviz is only in ldm's conda section
  - python-graphviz>=0.20.1

