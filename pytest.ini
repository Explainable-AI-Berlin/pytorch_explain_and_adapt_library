# Without this file (and the sibling conftest.py) `pytest tests` collected
# 4 tests and raised 11 errors, all "ModuleNotFoundError: No module named
# 'peal'": the package is not installed in the research environments and
# nothing put the repository root on sys.path.
[pytest]
testpaths = tests
python_files = *_test.py test_*.py
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
